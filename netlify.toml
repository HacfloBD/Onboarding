[build]
  command = "node scripts/write-config.mjs"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    # The YouTube player needs autoplay, encrypted-media, fullscreen and
    # picture-in-picture, so those are not restricted here.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # No inline scripts or inline event handlers anywhere: script-src is 'self' only.
    # style-src keeps 'unsafe-inline' for the inline style attributes in the markup.
    # img-src: our own files plus Supabase storage (logo thumbnails). The CSV
    # export uses a blob: URL for a download link, which img-src does not govern.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.youtube-nocookie.com; media-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
