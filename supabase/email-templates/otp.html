<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your FLO sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:'DM Sans',Arial,Helvetica,sans-serif;color:#1f2937">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:32px 12px"><tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden">
<tr><td style="background:#0a2a2e;padding:28px 32px" align="left"><img src="{{ .SiteURL }}/assets/brand/flo-logo-light.png" alt="FLO" height="40" style="display:block;height:40px;width:auto;border:0"></td></tr>
<tr><td style="height:4px;background:#2dd4bf;line-height:4px;font-size:0">&nbsp;</td></tr>
<tr><td style="padding:32px">
<h1 style="margin:0 0 12px;font-family:'Plus Jakarta Sans',Arial,sans-serif;font-size:22px;color:#0a2a2e;text-align:center">Your sign-in code</h1>
<p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#374151;text-align:center">Enter this code in the FLO onboarding portal to sign in.</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
<div style="display:inline-block;padding:18px 28px;background:#f0fdfa;border:1.5px solid #2dd4bf;border-radius:12px;font-family:'Plus Jakarta Sans',Consolas,'Courier New',monospace;font-size:36px;font-weight:800;letter-spacing:10px;color:#0a2a2e">{{ .Token }}</div>
</td></tr></table>
<p style="margin:24px 0 0;font-size:14px;line-height:1.6;color:#6b7280;text-align:center">This code expires in 10 minutes. If you did not request it, ignore this email.</p>
</td></tr>
<tr><td style="padding:20px 32px;background:#f9fafb;color:#9ca3af;font-size:12px;line-height:1.5">FLO Onboarding Portal by HAC Texas. This email was sent to {{ .Email }}.</td></tr>
</table>
</td></tr></table>
</body>
</html>
